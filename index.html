<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1er Parcial - DevOps</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #0f0728;
            color: #f5f3ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            text-align: center;
            background: #1f103c;
            padding: 2.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            border: 1px solid #3b1d6e;
            max-width: 500px;
            margin: 1rem;
        }
        h1 {
            color: #c084fc;
            margin-bottom: 0.5rem;
            font-size: 1.8rem;
        }
        p {
            color: #d8b4fe;
            font-size: 1rem;
            line-height: 1.5;
            margin: 0;
        }
        .badge {
            display: inline-block;
            background: #7c3aed;
            color: #ffffff;
            padding: 0.35rem 0.85rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 1.25rem;
            letter-spacing: 0.3px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>1er Parcial DevOps</h1>
        <p>Despliegue continuo automatizado con GitHub Actions y Surge.sh.</p>
        <span class="badge">CI/CD Pipeline Activo</span>
    </div>
</body>
</html>
